<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>왼쪽 메뉴</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Inter:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<aside aria-label="왼쪽 메뉴 (스크롤해도 화면에 고정)" style="box-sizing: border-box; width: 100%; min-height: 100vh; background: #2B2B2B; color: #FFFFFF; font-family: 'Noto Sans KR', sans-serif; letter-spacing: -0.01em; padding: 36px 28px 32px; display: flex; flex-direction: column; gap: 32px">
  <a href="Main.dc.html" aria-label="세무회계 일주 홈" style="display: flex; justify-content: center">
    <img src="assets/logo-vertical-white.png" alt="세무회계 일주" style="width: 104px; height: auto; display: block">
  </a>
  <nav aria-label="주 메뉴" style="display: flex; flex-direction: column">
    <sc-for list="{{menu}}" as="m" hint-placeholder-count="10">
      <a href="{{m.href}}" style="display: flex; align-items: center; gap: 10px; min-height: {{m.h}}; padding-left: {{m.indent}}; font-size: {{m.size}}; font-weight: 500; color: {{m.color}}; border-top: {{m.border}}; margin-top: {{m.gap}}; padding-top: {{m.gap}}">
        <span aria-hidden="true" style="display: inline-block; height: 2px; background: #D97757; width: {{m.barW}}"></span>{{m.label}}
      </a>
    </sc-for>
  </nav>
  <div aria-label="상담" style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.14)">
    <p style="margin: 0 0 4px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.16em; color: #E8A184">CONTACT</p>
    <a href="Contact.dc.html" style="display: flex; justify-content: center; align-items: center; min-height: 44px; padding: 0 14px; background: {{contactBg}}; border-radius: 8px; color: #FFFFFF; font-size: 15px; font-weight: 700">상담 신청하기</a>
    <a href="#" style="display: flex; align-items: center; gap: 10px; min-height: 36px; color: #FFFFFF; font-size: 14px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 34 34" style="flex: none"><rect width="34" height="34" rx="8" fill="#FEE500"></rect><path d="M17 9.5c-5 0-9 3.1-9 7 0 2.5 1.7 4.7 4.2 6l-1 3.6c-.1.3.3.6.6.4l4.2-2.8c.3 0 .7.1 1 .1 5 0 9-3.1 9-7s-4-7.3-9-7.3z" fill="#191919"></path></svg>카카오톡 상담</a>
    <a href="https://map.naver.com/p/entry/place/2058841701" style="display: flex; align-items: center; gap: 10px; min-height: 36px; color: #FFFFFF; font-size: 14px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 34 34" style="flex: none"><rect width="34" height="34" rx="8" fill="#03C75A"></rect><path d="M10.5 10h4.6l4.3 6.3V10H24v14h-4.6l-4.3-6.3V24h-4.6z" fill="#FFFFFF"></path></svg>네이버 방문예약</a>
    <a href="tel:07043480111" style="font-size: 13px; color: rgba(255,255,255,0.6)">전화 070-4348-0111</a>
  </div>
  <a href="https://map.naver.com/p/entry/place/2058841701" aria-label="오시는 길: 네이버 지도에서 보기" style="display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.14); color: #FFFFFF">
    <span style="margin: 0 0 4px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.16em; color: #E8A184">LOCATION</span>
    <span aria-hidden="true" style="position: relative; display: block; height: 88px; overflow: hidden; border-radius: 8px; background: #ECE7DF">
      <span style="position: absolute; left: 0; right: 0; top: 56px; height: 9px; background: #FFFFFF"></span>
      <span style="position: absolute; left: 0; right: 0; top: 20px; height: 5px; background: #FFFFFF; opacity: 0.85"></span>
      <span style="position: absolute; top: 0; bottom: 0; left: 62%; width: 10px; background: #FFFFFF"></span>
      <span style="position: absolute; top: 0; bottom: 0; left: 20%; width: 5px; background: #FFFFFF; opacity: 0.85"></span>
      <span style="position: absolute; left: 70%; top: 28px; width: 42px; height: 24px; border-radius: 4px; background: #DCE5D2"></span>
      <svg width="22" height="28" viewBox="0 0 36 46" style="position: absolute; left: calc(45% - 11px); top: 24px"><path d="M18 45C18 45 34 28.5 34 17.5C34 8.4 26.8 1.5 18 1.5C9.2 1.5 2 8.4 2 17.5C2 28.5 18 45 18 45Z" fill="#03C75A"></path><circle cx="18" cy="17" r="6.5" fill="#FFFFFF"></circle></svg>
    </span>
    <span style="font-size: 12px; line-height: 1.6; color: rgba(255,255,255,0.65); word-break: keep-all">전남광주통합특별시 북구<br>첨단과기로208번길 43-10<br>첨단IBC 지식산업센터 B동 619호</span>
  </a>
  <div aria-label="빠른 상담" style="position: fixed; right: 28px; bottom: 28px; z-index: 50; display: flex; flex-direction: column; gap: 12px">
    <a href="#" aria-label="카카오톡 상담" style="display: flex; justify-content: center; align-items: center; width: 60px; height: 60px; border-radius: 50%; background: #FEE500; box-shadow: 0 6px 18px rgba(0,0,0,0.18)">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 34 34"><path d="M17 7.5c-5.8 0-10.5 3.6-10.5 8.1 0 2.9 2 5.5 4.9 6.9l-1.2 4.3c-.1.4.3.7.7.5l4.9-3.3c.4 0 .8.1 1.2.1 5.8 0 10.5-3.6 10.5-8.1S22.8 7.5 17 7.5z" fill="#191919"></path></svg>
    </a>
    <a href="https://map.naver.com/p/entry/place/2058841701" aria-label="네이버 방문예약" style="display: flex; justify-content: center; align-items: center; width: 60px; height: 60px; border-radius: 50%; background: #03C75A; box-shadow: 0 6px 18px rgba(0,0,0,0.18)">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 34 34"><path d="M8 7h6.5l6 8.9V7H27v20h-6.5l-6-8.9V27H8z" fill="#FFFFFF"></path></svg>
    </a>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","about","service","channel","calc","location","contact"],"default":"home"},"sub":{"editor":"int","min":0,"max":5,"default":0},"$preview":{"width":264,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const sub = this.props.sub ?? 0;
    const groupOfService = [0, 0, 1, 2, 3, 3];
    const activeKey = active === 'service' ? 'grp' + (groupOfService[sub] ?? 0) : (active === 'home' ? 'about' : active);
    const groups = [
      { label: '사업 운영', href: 'Service-Bookkeeping.dc.html' },
      { label: '세무컨설팅', href: 'Service-Consulting.dc.html' },
      { label: '자산 이전', href: 'Service-Transfer.dc.html' },
      { label: '세금 바로잡기', href: 'Service-Refund.dc.html' }
    ];
    const items = [
      { key: 'about', label: '일주 소개', href: 'Main.dc.html' },
      { key: 'services', label: '업무 분야', href: 'Main.dc.html#situations', groupStart: true },
      ...groups.map((g, i) => ({ key: 'grp' + i, label: g.label, href: g.href, sub: true })),
      { key: 'channel', label: '채널 일주', href: 'Main.dc.html#channel', groupStart: true }
    ];
    const menu = items.map((it) => ({
      ...it,
      color: activeKey === it.key ? '#FFFFFF' : 'rgba(255,255,255,0.72)',
      barW: activeKey === it.key ? '14px' : '0px',
      border: it.groupStart ? '1px solid rgba(255,255,255,0.12)' : '0',
      gap: it.groupStart ? '10px' : '0px',
      size: it.sub ? '14px' : '15px',
      indent: it.sub ? '14px' : '0px',
      h: it.sub ? '32px' : '36px'
    }));
    return { menu, contactBg: activeKey === 'contact' ? '#B4552F' : '#D97757' };
  }
}
</script>
</body>
</html>
