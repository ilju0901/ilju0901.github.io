<script>
(() => {
  const image = document.querySelector('.scene > .art');
  if (!image) return;
  const root = document.documentElement;
  const brand = document.querySelector('.mobile-brand');
  const copy = document.querySelector('.mobile-copy');
  const brandImage = document.querySelector('.mobile-brand img');
  const earthImage = document.querySelector('.mobile-earth img');
  // Reuse the embedded artwork for the globe. The logo is cropped into a
  // transparent canvas so its old rectangular background cannot appear.
  earthImage.src = image.src;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const covers = [];
  let expired = false;
  const restore = () => {
    image.style.visibility = '';
    brand.style.opacity = '';
    copy.style.opacity = '';
    covers.forEach(node => node.remove());
  };
  if (!reduced) {
    image.style.visibility = 'hidden';
    brand.style.opacity = '0';
    copy.style.opacity = '0';
  }
  const safety = setTimeout(() => { expired = true; restore(); }, 5000);
  Promise.all([image.decode(), earthImage.decode(),
    document.fonts ? document.fonts.ready : Promise.resolve()]).then(async () => {
    const logoCanvas = document.createElement('canvas');
    logoCanvas.width = 557;
    logoCanvas.height = 166;
    const logoContext = logoCanvas.getContext('2d', {willReadFrequently:true});
    logoContext.drawImage(image, 120, 154, 557, 166, 0, 0, 557, 166);
    const logoFrame = logoContext.getImageData(0, 0, 557, 166);
    for (let index = 0; index < logoFrame.data.length; index += 4) {
      const light = Math.max(logoFrame.data[index], logoFrame.data[index + 1], logoFrame.data[index + 2]);
      logoFrame.data[index + 3] = Math.max(0, Math.min(255, Math.round((light - 20) * 3.2)));
    }
    logoContext.putImageData(logoFrame, 0, 0);
    brandImage.src = logoCanvas.toDataURL('image/png');
    await brandImage.decode();
    root.classList.add('mobile-ready');
    if (expired || reduced || !Element.prototype.animate) {
      clearTimeout(safety); restore(); return;
    }
    // Desktop keeps its exact approved pixels. Temporary covers hide only
    // the logo and message regions, then fade away on the shared timeline.
    const sourceCanvas = document.createElement('canvas');
    sourceCanvas.width = image.naturalWidth;
    sourceCanvas.height = image.naturalHeight;
    const sourceContext = sourceCanvas.getContext('2d');
    sourceContext.drawImage(image, 0, 0);
    const source = sourceContext.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height).data;
    const makeCover = (strips) => {
      const canvas = document.createElement('canvas');
      canvas.className = 'art sequence-cover';
      canvas.setAttribute('aria-hidden', 'true');
      canvas.width = sourceCanvas.width;
      canvas.height = sourceCanvas.height;
      canvas.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none';
      const context = canvas.getContext('2d');
      const frame = context.createImageData(canvas.width, canvas.height);
      for (const [left, right, top, bottom] of strips) {
        for (let x = left; x <= right; x++) {
          const above = (top * canvas.width + x) * 4;
          const below = (bottom * canvas.width + x) * 4;
          for (let y = top + 1; y < bottom; y++) {
            const fraction = (y - top) / (bottom - top);
            const index = (y * canvas.width + x) * 4;
            for (let channel = 0; channel < 3; channel++) {
              frame.data[index + channel] = Math.round(source[above + channel] * (1 - fraction) + source[below + channel] * fraction);
            }
            frame.data[index + 3] = 255;
          }
        }
      }
      context.putImageData(frame, 0, 0);
      image.after(canvas);
      covers.push(canvas);
      return canvas;
    };
    const logoCover = makeCover([[120, 677, 154, 320]]);
    const messageCover = makeCover([[125, 600, 518, 571], [125, 600, 575, 625], [125, 790, 648, 715]]);
    image.style.visibility = '';
    const timeline = [
      logoCover.animate([{opacity:1},{opacity:0}], {duration:1000,fill:'both',easing:'ease-in-out'}),
      messageCover.animate([{opacity:1},{opacity:0}], {duration:1000,delay:1000,fill:'both',easing:'ease-in-out'}),
      brand.animate([{opacity:0},{opacity:1}], {duration:1000,fill:'both',easing:'ease-in-out'}),
      copy.animate([{opacity:0},{opacity:1}], {duration:1000,delay:1000,fill:'both',easing:'ease-in-out'})
    ];
    const start = document.timeline.currentTime;
    timeline.forEach(animation => { animation.startTime = start; });
    Promise.all(timeline.map(animation => animation.finished)).then(() => {
      clearTimeout(safety); restore(); timeline.forEach(animation => animation.cancel());
    }).catch(() => { clearTimeout(safety); restore(); timeline.forEach(animation => animation.cancel()); });
  }).catch(() => { clearTimeout(safety); restore(); });
})();

</script>
</body>
